[workspace]
resolver = "2"
members = [
  "swap_elements",
  "swap_elements_opt3",
  "rust_array",
  "rust_array_tests",
  "rust_u64_tests",
  "num_integer",
  "num_integer_opt3",
  "rust_u64",
  "total_variation",
  "float_trunc",
  "float_minmax",
  "float_round",
  "float_reinterpret",
  "talos_stdio",
  "mergesort",
]
[profile.release]
opt-level = 0
lto = false
codegen-units = 1

# `num_integer_opt3` is byte-for-byte the same source as `num_integer`, but
# compiled at `opt-level = 3` (everything else at the workspace default 0). The
# two emitted wasm modules are the subject of a program-equivalence proof.
[profile.release.package.num_integer_opt3]
opt-level = 3

# Likewise `swap_elements_opt3` mirrors `swap_elements` at `opt-level = 3`.
# Unlike the `gcd` pair, this function's result lives in linear memory, so the
# two builds are related by a *memory-aware* observational equivalence.
[profile.release.package.swap_elements_opt3]
opt-level = 3

# `mergesort` (and its only dependency, `talos-stdio`, which no other crate
# uses) is compiled for the shortest wasm binary. Counterintuitively the
# nominal size-first levels lose to plain 3 on this crate (rustc 1.95.0,
# fully stripped build/mergesort/program.wasm): opt-level 0 = 55 865 B,
# "z" = 40 807 B, "s" = 40 423 B, 3 = 40 416 B.
[profile.release.package.mergesort]
opt-level = 3

[profile.release.package.talos-stdio]
opt-level = 3
