name = "Verifier"
version = "0.1.0"
defaultTargets = ["verifier"]
packagesDir = "../.lake/packages"

# Lean 4.35: Mathlib is designed for the module system; Talos files are not
# (yet) modules. Opt out of the per-import warning instead of migrating here.
allowNonModules = true

[[require]]
name = "WasmInterpreterLean"
path = "../interpreter"

[[lean_lib]]
name = "Verifier"

[[lean_exe]]
name = "verifier"
root = "Verifier.Main"
