name = "CodeLib"
version = "0.1.0"
defaultTargets = ["CodeLib"]
packagesDir = "../.lake/packages"

# Lean 4.35: Mathlib is designed for the module system; Talos files are not
# (yet) modules. Opt out of the per-import warning instead of migrating here.
allowNonModules = true

# Mathlib's `linter.concreteInstances` (on by default since Mathlib v4.36.0)
# asks for a global instance instead of a local `[C T]` assumption with no free
# variables. That advice does not apply to the iris ghost-state classes
# (`WasmHeapGS α`, `WasmGlobalGS α`, ...): their instances carry ghost names
# that only adequacy allocates, so a proof must assume them. `weak.` because the
# option is only registered in modules that import Mathlib.
[leanOptions]
weak.linter.concreteInstances = false

[[require]]
name = "WasmInterpreterLean"
path = "../interpreter"

[[require]]
name = "iris"
git.url = "https://github.com/leanprover-community/iris-lean.git"
git.subDir = "Iris"
# Pin the upstream Lean 4.36 bump (iris-lean 40e6418437a794dcd0429bfbe4d6b60fdafb2ecd).
rev = "40e6418437a794dcd0429bfbe4d6b60fdafb2ecd"

[[lean_lib]]
name = "CodeLib"
roots = [
  "CodeLib",
  # Not reachable from the `CodeLib` umbrella on purpose: it declares the float
  # bridge axioms, which should not enter every downstream module's environment.
  # It is still a root so the codelib build keeps checking it.
  "CodeLib.IEEE32.Exec",
  "CodeLib.Examples.Gcd",
  "CodeLib.Examples.MergeSort.StdIO",
  "CodeLib.Examples.Quicksort.TotalProof",
  "CodeLib.Examples.MemFillLoop",
  "CodeLib.Examples.MemCopyLoop",
  # Near SmallStep example (not reachable from CodeLib.Near.Proof).
  "CodeLib.Near.Examples.KvSetter",
]
