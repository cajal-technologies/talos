name = "CodeLib"
version = "0.1.0"
defaultTargets = ["CodeLib"]
packagesDir = "../.lake/packages"

[[require]]
name = "WasmInterpreterLean"
path = "../interpreter"

[[require]]
name = "iris"
git.url = "https://github.com/leanprover-community/iris-lean.git"
git.subDir = "Iris"
# Pin the upstream Lean 4.34.1 migration (iris-lean#702).
rev = "04b7689c294bb1dd6401e2dd53b337871934ea47"

[[lean_lib]]
name = "CodeLib"
roots = [
  "CodeLib",
  # Not reachable from the `CodeLib` umbrella on purpose: it declares the float
  # bridge axioms, which should not enter every downstream module's environment.
  # It is still a root so the codelib build keeps checking it.
  "CodeLib.IEEE32.Exec",
  "CodeLib.Examples.Gcd",
  "CodeLib.Examples.MergeSort.StdIO",
  "CodeLib.Examples.Quicksort.TotalProof",
  # Near SmallStep example (not reachable from CodeLib.Near.Proof).
  "CodeLib.Near.Examples.KvSetter",
]
