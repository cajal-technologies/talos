name = "Interpreter"
version = "0.1.0"
defaultTargets = ["Interpreter"]
packagesDir = "../.lake/packages"

# Lean 4.35: Mathlib is designed for the module system; Talos files are not
# (yet) modules. Opt out of the per-import warning instead of migrating here.
allowNonModules = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "Interpreter"

[[lean_exe]]
name = "runner"
root = "Interpreter.Runner"

[[lean_exe]]
name = "testsuite"
root = "Interpreter.Testsuite"
