name = "Interpreter"
version = "0.1.0"
defaultTargets = ["Interpreter"]
packagesDir = "../.lake/packages"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.2"

[[lean_lib]]
name = "Interpreter"

# Execution-based specification testing (`Interpreter.Wasm.SpecTest`): a library
# that problem workspaces link into their own `spec_test` executable.
[[lean_lib]]
name = "WasmSpecTest"
roots = ["Interpreter.Wasm.SpecTest"]
globs = ["Interpreter.Wasm.SpecTest.+"]

[[lean_exe]]
name = "runner"
root = "Interpreter.Runner"

[[lean_exe]]
name = "testsuite"
root = "Interpreter.Testsuite"
