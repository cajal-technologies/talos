name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  codelib:
    name: Build CodeLib proofs
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: .lake/packages
          key: lake-pkgs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('interpreter/lake-manifest.json') }}
          restore-keys: |
            lake-pkgs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: codelib
          build-args: "--wfail"
          use-mathlib-cache: true

  # Emitted Program.lean modules embed a compile-time provenance check that
  # reads ../rust/build/<crate>/program.wat, so the proofs job needs the wasm
  # build outputs. They are built once here — on ubuntu, the canonical
  # environment the Verifier Freshness workflow also uses — and handed to the
  # macOS proofs job as an artifact, so both jobs see identical bytes.
  wasm:
    name: Build program wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: verifier
          build-args: verifier
          use-mathlib-cache: false
      - name: Install pinned Rust toolchain
        working-directory: programs/rust
        run: rustup show active-toolchain || rustup toolchain install
      # Keep this pin in sync with WASM_TOOLS_VERSION in the justfile — the
      # wat this prints is embedded verbatim in the emitted Program.lean.
      - name: Install wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.251.0
      - name: Build wasm
        working-directory: programs
        run: lake -d ../verifier exe verifier build
      - uses: actions/upload-artifact@v6
        with:
          name: program-wasm
          path: programs/rust/build/
          if-no-files-found: error

  programs:
    name: Build program proofs
    runs-on: macos-latest
    needs: wasm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: program-wasm
          path: programs/rust/build/
      - uses: actions/cache@v5
        with:
          path: .lake/packages
          key: lake-pkgs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('interpreter/lake-manifest.json') }}
          restore-keys: |
            lake-pkgs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: programs/lean
          build-args: "Project --wfail"
          use-mathlib-cache: true

  test:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: [codelib, programs]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: .lake/packages
          key: lake-pkgs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('interpreter/lake-manifest.json') }}
          restore-keys: |
            lake-pkgs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: interpreter
          # Build the `Interpreter` library (not just the `runner` exe) so the
          # worked examples under Interpreter/Wasm/Examples/ — which the main
          # `programs/lean` build does not reach — are compiled and their
          # `native_decide` checks run, keeping an example from silently
          # rotting. Coverage is only as complete as Examples/Basic.lean's
          # umbrella import: this build reaches an example iff Basic.lean
          # imports it, so every example file must be listed there.
          build-args: Interpreter runner
          use-mathlib-cache: true
      - name: Install just
        uses: taiki-e/install-action@just
      - name: Runner smoke test
        run: just runner-smoke
